name: Build EuroOffice 9.3.5 x2t WASM (owned snapshots v9)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prepare EuroOffice source only, or attempt full Docker compilation'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - build
      runner_label:
        description: 'Exact configured runner label: ubuntu-24.04 or your own larger/self-hosted label'
        type: string
        required: true
        default: 'ubuntu-24.04'
      minimum_free_gib:
        description: 'Free disk GiB after SDK cleanup; 8 is experimental for free runners'
        type: choice
        required: true
        default: '8'
        options:
          - '8'
          - '12'
          - '20'
          - '40'
          - '60'
      cleanup_standard_host:
        description: 'Remove unused SDKs only on standard ephemeral GitHub-hosted Ubuntu runners'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: eurooffice-x2t-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
      BUILD_RUNNER_LABEL: ${{ inputs.runner_label }}
      MINIMUM_FREE_GIB: ${{ inputs.minimum_free_gib }}
    steps:
      - name: Checkout independent builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test source preparation and verify syntax
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile scripts/prepare_eurooffice.py scripts/port_renderer_qmake.py scripts/check_docker_recipe.py scripts/tune_docker_recipe.py scripts/check_build_resources.py scripts/optimize_docker_layers.py scripts/source_snapshot.py scripts/audit_external_inputs.py
          for script in scripts/fetch_sources.sh scripts/fetch_archived_sources.sh scripts/bootstrap_upstream.sh scripts/cleanup_hosted_runner.sh scripts/build_with_telemetry.sh; do
            bash -n "$script"
          done
          node --check scripts/verify_converter.cjs
          node --check scripts/smoke_docx.cjs

      - name: Free only unused SDKs on disposable standard GitHub runners
        if: inputs.mode == 'build' && inputs.cleanup_standard_host
        run: bash scripts/cleanup_hosted_runner.sh

      - name: Restore pinned sources from our own checksummed release (never live CryptPad)
        run: bash scripts/fetch_archived_sources.sh

      - name: Prepare reviewed EuroOffice WASM source (no cross-fork merge)
        run: |
          set -euo pipefail
          mkdir -p artifacts/provenance
          python3 scripts/prepare_eurooffice.py \
            --cryptpad .work/cryptpad/core \
            --target .work/eurooffice \
            --policy config/port-policy.json \
            --report artifacts/provenance/source-preparation.json

      - name: Port CryptPad browser-only renderer qmake descriptions (exclude V8 inspector)
        run: |
          set -euo pipefail
          python3 scripts/port_renderer_qmake.py \
            --cryptpad .work/cryptpad/core \
            --target .work/eurooffice \
            --report artifacts/provenance/renderer-qmake-port.json

      - name: Repair parser stages and UnicodeConverter archive; audit recipe
        run: |
          set -euo pipefail
          python3 scripts/tune_docker_recipe.py .work/cryptpad/Dockerfile
          python3 scripts/check_docker_recipe.py .work/cryptpad/Dockerfile \
            --report artifacts/provenance/docker-recipe-audit.json

      - name: Deduplicate Docker source layers before compilation
        run: |
          set -euo pipefail
          python3 scripts/optimize_docker_layers.py .work/cryptpad/Dockerfile \
            --report artifacts/provenance/shared-layers.json

      - name: Record exact source modifications and audit still-unmirrored dependencies
        run: |
          set -euo pipefail
          cp .work/*.commit artifacts/provenance/
          cp config/sources.lock.json artifacts/provenance/source-lock.json
          cp config/port-policy.json artifacts/provenance/port-policy.json
          python3 scripts/audit_external_inputs.py .work/cryptpad/Dockerfile \
            --report artifacts/provenance/remaining-network-dependencies.json
          { echo 'Pinned CryptPad-derived build recipe:'; cat .work/cryptpad.commit;
            echo 'EuroOffice source pin:'; cat .work/eurooffice.commit;
            echo 'Emscripten toolchain:'; grep -nE '^(FROM ubuntu:|ARG emversion=)' .work/cryptpad/Dockerfile; } \
            > artifacts/provenance/recipe.txt
          df -h .

      - name: Construct EuroOffice-only Docker compilation input
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          rm -rf .work/cryptpad/core
          # Move instead of copying 650+ MB of source a second time.
          mv .work/eurooffice .work/cryptpad/core
          # Provenance was already captured; .git is unnecessary in Docker context.
          rm -rf .work/cryptpad/core/.git .work/cryptpad/.git
          printf '\n.git\n**/.git\n' >> .work/cryptpad/.dockerignore
          for f in doctrenderer_empty.cpp docbuilder_empty.cpp docbuilder_p_empty.cpp; do
            test -s ".work/cryptpad/core/DesktopEditor/doctrenderer/$f"
          done
          test -f .work/cryptpad/wrap-main.cpp
          test -f .work/cryptpad/pre-js.js
          du -sh .work/cryptpad/core .work/cryptpad 2>/dev/null || true
          df -h .

      - name: Check Docker filesystem capacity before compilation
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          python3 scripts/check_build_resources.py \
            --minimum-gib "${MINIMUM_FREE_GIB}" \
            --report artifacts/provenance/storage-preflight.json

      - name: Compile with storage telemetry and one active stage
        if: inputs.mode == 'build'
        run: bash scripts/build_with_telemetry.sh

      - name: Verify compiled artifacts
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          node scripts/verify_converter.cjs artifacts/converter
          node --check artifacts/converter/x2t.js

      - name: Execute DOCX round trip
        if: inputs.mode == 'build'
        run: node --max-old-space-size=6144 scripts/smoke_docx.cjs artifacts/converter

      - name: Upload converter only after smoke test
        if: inputs.mode == 'build' && success()
        uses: actions/upload-artifact@v4
        with:
          name: eurooffice-9.3.5-x2t-wasm-verified-docx-smoke
          path: artifacts/converter/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurooffice-9.3.5-x2t-build-diagnostics
          path: artifacts/provenance/
          if-no-files-found: warn
          retention-days: 30
