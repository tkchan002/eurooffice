name: Build EuroOffice 9.3.5 x2t WASM (parser sources v4)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Prepare EuroOffice source only, or attempt full Docker compilation'
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - build

permissions:
  contents: read

concurrency:
  group: eurooffice-x2t-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Checkout independent builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test source preparation and verify syntax
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m py_compile scripts/prepare_eurooffice.py scripts/check_docker_recipe.py scripts/tune_docker_recipe.py
          bash -n scripts/fetch_sources.sh
          node --check scripts/verify_converter.cjs
          node --check scripts/smoke_docx.cjs

      - name: Fetch pinned CryptPad and EuroOffice source
        run: bash scripts/fetch_sources.sh

      - name: Prepare reviewed EuroOffice WASM source (no cross-fork merge)
        run: |
          set -euo pipefail
          mkdir -p artifacts/provenance
          python3 scripts/prepare_eurooffice.py \
            --cryptpad .work/cryptpad/core \
            --target .work/eurooffice \
            --policy config/port-policy.json \
            --report artifacts/provenance/source-preparation.json

      - name: Repair Gumbo/Katana Docker references and enforce fail-closed recipe audit
        run: |
          set -euo pipefail
          python3 scripts/tune_docker_recipe.py .work/cryptpad/Dockerfile
          python3 scripts/check_docker_recipe.py .work/cryptpad/Dockerfile \
            --report artifacts/provenance/docker-recipe-audit.json

      - name: Record exact source modifications
        run: |
          set -euo pipefail
          cp .work/*.commit artifacts/provenance/
          cp config/port-policy.json artifacts/provenance/port-policy.json
          git -C .work/eurooffice diff --stat > artifacts/provenance/eurooffice-diff-stat.txt
          git -C .work/eurooffice diff --binary > artifacts/provenance/eurooffice-diff.patch
          git -C .work/cryptpad diff -- Dockerfile > artifacts/provenance/docker-diff.patch
          { echo 'The Docker recipe was pinned by CryptPad commit:'; cat .work/cryptpad.commit;
            echo 'Emscripten toolchain:'; grep -nE '^(FROM ubuntu:|ARG emversion=)' .work/cryptpad/Dockerfile; } > artifacts/provenance/recipe.txt
          df -h .

      - name: Construct EuroOffice-only Docker compilation input
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          rm -rf .work/cryptpad/core
          mkdir -p .work/cryptpad/core
          rsync -a --exclude='.git/' .work/eurooffice/ .work/cryptpad/core/
          printf '\n.git\n' >> .work/cryptpad/.dockerignore
          for f in doctrenderer_empty.cpp docbuilder_empty.cpp docbuilder_p_empty.cpp; do
            test -s ".work/cryptpad/core/DesktopEditor/doctrenderer/$f"
          done
          test -f .work/cryptpad/wrap-main.cpp
          test -f .work/cryptpad/pre-js.js
          df -h .

      - name: Compile EuroOffice 9.3.5 using Emscripten 4.0.11
        if: inputs.mode == 'build'
        working-directory: .work/cryptpad
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/converter
          docker buildx build \
            --file Dockerfile \
            --target output \
            --output type=local,dest=../../artifacts/converter \
            --progress=plain . 2>&1 | tee ../../artifacts/provenance/docker-build.log

      - name: Verify compiled artifacts
        if: inputs.mode == 'build'
        run: |
          set -euo pipefail
          node scripts/verify_converter.cjs artifacts/converter
          node --check artifacts/converter/x2t.js

      - name: Execute DOCX round trip
        if: inputs.mode == 'build'
        run: node --max-old-space-size=6144 scripts/smoke_docx.cjs artifacts/converter

      - name: Upload converter only after smoke test
        if: inputs.mode == 'build' && success()
        uses: actions/upload-artifact@v4
        with:
          name: eurooffice-9.3.5-x2t-wasm-verified-docx-smoke
          path: artifacts/converter/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurooffice-9.3.5-x2t-build-diagnostics
          path: artifacts/provenance/
          if-no-files-found: warn
          retention-days: 30
